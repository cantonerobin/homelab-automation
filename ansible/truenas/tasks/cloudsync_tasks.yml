---
# Cloud sync tasks: PUSH (active backups) + PULL (restore tasks, disabled).
# Depends on cloud_cred_id set in tasks/cloudsync_credentials.yml.
#
# Restore tasks are created disabled — to restore:
#   1. Enable the task in TrueNAS UI, or run: midclt call --job cloudsync.sync <id>
#   2. After restore: copy files from restore_path to live path, re-disable the task.
# ⚠️ Restore path must exist before running — ensured by the directory task below.

# ------------------------------------------------------------------ #
# Pre-create remote directories on Hetzner Storage Box
# ------------------------------------------------------------------ #
# Hetzner's SFTP implementation returns SSH_FX_FAILURE when rclone tries to
# mkdir top-level directories — it cannot create them itself. Pre-create via
# SSH so rclone only needs to write files into existing directories.
- block:
    - name: Write SSH key to /tmp for remote directory creation
      copy:
        content: "{{ hetzner_ssh_private_key }}"
        dest: /tmp/hetzner-ssh-key-dirs
        mode: "0600"

    - name: Pre-create remote backup directories on Hetzner Storage Box
      command: >
        ssh -i /tmp/hetzner-ssh-key-dirs
        -p {{ hetzner_storagebox_port }}
        -o StrictHostKeyChecking=no
        -o BatchMode=yes
        {{ hetzner_storagebox_user }}@{{ hetzner_storagebox_host }}
        "mkdir -p {{ item.folder | regex_replace('^/', '') }}"
      loop: "{{ cloudsync_tasks }}"
      changed_when: false

  always:
    - name: Delete temp SSH key (remote dir creation)
      file:
        path: /tmp/hetzner-ssh-key-dirs
        state: absent

# ------------------------------------------------------------------ #
# Cloud sync tasks
# ------------------------------------------------------------------ #
- name: Query existing cloud sync tasks
  command: midclt call cloudsync.query
  register: existing_tasks_raw
  changed_when: false

- name: Create cloud sync tasks (PUSH)
  shell: >
    midclt call cloudsync.create
    '{"description": "{{ item.description }}",
      "direction": "PUSH",
      "transfer_mode": "SYNC",
      "snapshot": true,
      "path": "{{ item.path }}",
      "credentials": {{ cloud_cred_id | int }},
      "attributes": {"folder": "{{ item.folder }}"},
      "encryption": true,
      "filename_encryption": true,
      "encryption_password": "{{ hetzner_rclone_encryption_password }}",
      "encryption_salt": "{{ hetzner_rclone_encryption_salt }}",
      "schedule": {{ item.schedule | to_json }},
      "args": "--sftp-set-modtime=false --checksum",
      "enabled": true}'
  loop: "{{ cloudsync_tasks }}"
  when: >
    item.description not in
    (existing_tasks_raw.stdout | from_json | map(attribute='description') | list)

- name: Create restore path directories
  file:
    path: "{{ item.restore_path }}"
    state: directory
    mode: "0755"
  loop: "{{ cloudsync_restore_tasks }}"

- name: Create cloud sync tasks (PULL / restore, disabled)
  shell: >
    midclt call cloudsync.create
    '{"description": "{{ item.description }}",
      "direction": "PULL",
      "transfer_mode": "COPY",
      "snapshot": false,
      "path": "{{ item.restore_path }}",
      "credentials": {{ cloud_cred_id | int }},
      "attributes": {"folder": "{{ item.source_folder }}"},
      "encryption": true,
      "filename_encryption": true,
      "encryption_password": "{{ hetzner_rclone_encryption_password }}",
      "encryption_salt": "{{ hetzner_rclone_encryption_salt }}",
      "schedule": {"minute": "0", "hour": "0", "dom": "1", "month": "1", "dow": "*"},
      "args": "--sftp-set-modtime=false --checksum",
      "enabled": false}'
  loop: "{{ cloudsync_restore_tasks }}"
  when: >
    item.description not in
    (existing_tasks_raw.stdout | from_json | map(attribute='description') | list)
