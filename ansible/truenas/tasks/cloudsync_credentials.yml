---
# Hetzner Storage Box SFTP credential.
# Depends on keychain_cred_id set in tasks/cloudsync_keychain.yml.

- name: Query existing cloud sync credentials
  command: midclt call cloudsync.credentials.query
  register: existing_creds_raw
  changed_when: false

- name: Create SFTP credential
  shell: >
    midclt call cloudsync.credentials.create
    '{"name": "Hetzner Storage Box",
      "provider": {"type": "SFTP",
                   "host": "{{ hetzner_storagebox_host }}",
                   "port": {{ hetzner_storagebox_port }},
                   "user": "{{ hetzner_storagebox_user }}",
                   "pass": "",
                   "private_key": {{ keychain_cred_id | int }}}}'
  when: >
    (existing_creds_raw.stdout | from_json |
     selectattr('name', 'equalto', 'Hetzner Storage Box') | list | length) == 0

- name: Query cloud sync credentials (after creation)
  command: midclt call cloudsync.credentials.query
  register: creds_after_raw
  changed_when: false

- name: Set cloud credential ID as fact
  set_fact:
    cloud_cred_id: "{{ (creds_after_raw.stdout | from_json | selectattr('name', 'equalto', 'Hetzner Storage Box') | list | first).id }}"
