---
# Konfiguration via SSH + midclt
# Voraussetzung: SSH aktiviert + ansible.pub beim root-User hinterlegt (manuell via WebUI)

- name: TrueNAS konfigurieren
  hosts: truenas
  gather_facts: false
  vars_files:
    - vars/config.yml
    - vars/secrets.yml

  tasks:

    # ------------------------------------------------------------------ #
    # ------------------------------------------------------------------ #
    # Disk-Namen aus Seriennummern auflösen
    # ------------------------------------------------------------------ #
    - name: Alle Disks abfragen
      command: midclt call disk.query
      register: all_disks_raw
      changed_when: false

    - name: Disk-Namen aus Serials auflösen
      set_fact:
        all_disks: "{{ all_disks_raw.stdout | from_json }}"
        data_pool_disks: "{{ all_disks_raw.stdout | from_json | selectattr('serial', 'in', data_pool_serials) | map(attribute='name') | list }}"
        archive_pool_disk: "{{ (all_disks_raw.stdout | from_json | selectattr('serial', 'equalto', archive_pool_serial) | map(attribute='name') | list)[0] }}"

    - name: Prüfen ob alle Data-Disks gefunden
      assert:
        that: data_pool_disks | length == data_pool_serials | length
        fail_msg: "Nicht alle Disks gefunden! Erwartet {{ data_pool_serials }}, gefunden: {{ data_pool_disks }}"

    - name: Gefundene Disk-Namen anzeigen
      debug:
        msg: "data pool disks: {{ data_pool_disks }} | archive disk: {{ archive_pool_disk }}"

    # ------------------------------------------------------------------ #
    # data pool
    # ------------------------------------------------------------------ #
    - name: Prüfen ob data pool existiert
      command: midclt call pool.query '[["name","=","data"]]'
      register: existing_data_pool_raw
      changed_when: false

    - name: Data-Disks wipen
      include_tasks: tasks/wipe_disk.yml
      loop: "{{ data_pool_disks }}"
      loop_control:
        loop_var: disk_name
      when: existing_data_pool_raw.stdout | from_json | length == 0

    - name: data pool anlegen (RAIDZ1)
      command: midclt call --job pool.create '{{ pool_body | to_json }}'
      vars:
        pool_body:
          name: data
          topology:
            data:
              - type: RAIDZ1
                disks: "{{ data_pool_disks }}"
      when: existing_data_pool_raw.stdout | from_json | length == 0

    # ------------------------------------------------------------------ #
    # archive pool (2TB SSD)
    # ------------------------------------------------------------------ #
    - name: Prüfen ob archive pool existiert
      command: midclt call pool.query '[["name","=","archive"]]'
      register: existing_archive_pool_raw
      changed_when: false

    - name: Archive-Disk wipen
      include_tasks: tasks/wipe_disk.yml
      loop:
        - "{{ archive_pool_disk }}"
      loop_control:
        loop_var: disk_name
      when: existing_archive_pool_raw.stdout | from_json | length == 0

    - name: archive pool anlegen (single disk)
      command: midclt call --job pool.create '{{ pool_body | to_json }}'
      vars:
        pool_body:
          name: archive
          topology:
            data:
              - type: STRIPE
                disks:
                  - "{{ archive_pool_disk }}"
      when: existing_archive_pool_raw.stdout | from_json | length == 0

    # ------------------------------------------------------------------ #
    # Datasets
    # ------------------------------------------------------------------ #
    - name: Existierende Datasets abfragen
      command: midclt call pool.dataset.query
      register: existing_datasets_raw
      changed_when: false

    - name: Datasets anlegen
      command: midclt call pool.dataset.create '{{ dataset_body | to_json }}'
      vars:
        dataset_body: >-
          {{
            {"name": item.name, "compression": "LZ4"}
            | combine({"recordsize": item.recordsize} if item.recordsize is defined else {})
            | combine({"atime": item.atime} if item.atime is defined else {})
          }}
      loop: "{{ datasets }}"
      when: item.name not in (existing_datasets_raw.stdout | from_json | map(attribute='name') | list)

    - name: Dataset-Properties aktualisieren
      command: midclt call pool.dataset.update '"{{ item.name }}"' '{{ update_body | to_json }}'
      vars:
        update_body: >-
          {{
            {"compression": "LZ4"}
            | combine({"recordsize": item.recordsize} if item.recordsize is defined else {})
            | combine({"atime": item.atime} if item.atime is defined else {})
          }}
      loop: "{{ datasets }}"
      when: item.name in (existing_datasets_raw.stdout | from_json | map(attribute='name') | list)

    # ------------------------------------------------------------------ #
    # Zvols
    # ------------------------------------------------------------------ #
    - name: Zvols anlegen
      shell: >
        midclt call pool.dataset.create
        '{"name": "{{ item.name }}", "type": "VOLUME", "volsize": {{ item.volsize | int }}, "volblocksize": "{{ item.volblocksize }}", "sparse": true}'
      loop: "{{ zvols }}"
      when: item.name not in (existing_datasets_raw.stdout | from_json | map(attribute='name') | list)

    # ------------------------------------------------------------------ #
    # Users
    # ------------------------------------------------------------------ #
    - name: Media-User abfragen
      command: midclt call user.query '[["uid","=",{{ media_user.uid }}]]'
      register: existing_media_user_raw
      changed_when: false

    - name: Media-User anlegen (UID 1000, kein Login)
      command: >
        midclt call user.create
        '{"username": "{{ media_user.username }}", "uid": {{ media_user.uid }}, "group_create": true, "full_name": "Media", "shell": "/usr/sbin/nologin", "home": "/var/empty", "password_disabled": true, "smb": false}'
      when: existing_media_user_raw.stdout | from_json | length == 0

    # ------------------------------------------------------------------ #
    # NFS
    # ------------------------------------------------------------------ #
    - name: NFS Service starten
      command: midclt call service.control '"START"' '"nfs"' '{}'
      changed_when: false

    - name: NFS Service-ID abfragen
      command: midclt call service.query '[["service","=","nfs"]]'
      register: nfs_service_raw
      changed_when: false

    - name: NFS Autostart aktivieren
      command: >
        midclt call service.update
        '{{ (nfs_service_raw.stdout | from_json)[0].id }}'
        '{"enable": true}'

    - name: Existierende NFS-Shares abfragen
      command: midclt call sharing.nfs.query
      register: existing_nfs_raw
      changed_when: false

    - name: Ownership auf mediastack-data Dataset-Root setzen
      file:
        path: "/mnt/data/mediastack/mediastack-data"
        state: directory
        owner: "{{ media_user.uid }}"
        group: "{{ media_user.uid }}"
        mode: "0755"

    - name: NFS-Shares anlegen
      command: midclt call sharing.nfs.create '{{ share_body | to_json }}'
      vars:
        share_body:
          path: "{{ item.path }}"
          hosts: "{{ item.hosts | default([]) }}"
          networks: "{{ [] if item.hosts is defined else [nfs_allowed_network] }}"
          mapall_user: "{{ item.mapall_user | default('root') }}"
          mapall_group: "{{ item.mapall_group | default('wheel') }}"
      loop: "{{ nfs_shares }}"
      when: item.path not in (existing_nfs_raw.stdout | from_json | map(attribute='path') | list)

    - name: NFS-Shares aktualisieren (Hosts, mapall)
      command: midclt call sharing.nfs.update '{{ share_id }}' '{{ share_body | to_json }}'
      vars:
        share_id: "{{ (existing_nfs_raw.stdout | from_json | selectattr('path', 'equalto', item.path) | list)[0].id }}"
        share_body:
          hosts: "{{ item.hosts | default([]) }}"
          networks: "{{ [] if item.hosts is defined else [nfs_allowed_network] }}"
          mapall_user: "{{ item.mapall_user | default('root') }}"
          mapall_group: "{{ item.mapall_group | default('wheel') }}"
      loop: "{{ nfs_shares }}"
      when: item.path in (existing_nfs_raw.stdout | from_json | map(attribute='path') | list)

    # ------------------------------------------------------------------ #
    # Snapshot Tasks
    # ------------------------------------------------------------------ #
    - name: Existierende Snapshot-Tasks abfragen
      command: midclt call pool.snapshottask.query
      register: existing_snapshots_raw
      changed_when: false

    - name: Snapshot-Tasks anlegen
      command: midclt call pool.snapshottask.create '{{ snapshot_body | to_json }}'
      vars:
        snapshot_body:
          dataset: "{{ item.name }}"
          recursive: false
          lifetime_value: 2
          lifetime_unit: WEEK
          enabled: true
          naming_schema: "auto-%Y-%m-%d_%H-%M"
          schedule:
            minute: "0"
            hour: "0"
            dom: "*"
            month: "*"
            dow: "*"
      loop: "{{ datasets }}"
      when:
        - item.name not in (existing_snapshots_raw.stdout | from_json | map(attribute='dataset') | list)
        - item.snapshot | default(true)

    # ------------------------------------------------------------------ #
    # Scrub Tasks
    # ------------------------------------------------------------------ #
    # Hinweis: pool.scrub.create erwartet pool-ID (integer), nicht pool_name (string).

    - name: Existierende Scrub-Tasks abfragen
      command: midclt call pool.scrub.query
      register: existing_scrub_raw
      changed_when: false

    - name: Pool-IDs abfragen
      command: midclt call pool.query '[["name","=","{{ item }}"]]'
      register: pool_ids_raw
      loop:
        - data
        - archive
      changed_when: false

    - name: Scrub-Tasks anlegen
      command: midclt call pool.scrub.create '{{ scrub_body | to_json }}'
      vars:
        pool_id: "{{ (pool_ids_raw.results[loop_index].stdout | from_json)[0].id }}"
        existing_scrub_pool_names: "{{ existing_scrub_raw.stdout | from_json | map(attribute='pool_name') | list }}"
        scrub_body:
          pool: "{{ pool_id }}"
          threshold: 35
          enabled: true
          schedule:
            minute: "0"
            hour: "0"
            dom: "1"
            month: "*"
            dow: "*"
      loop:
        - data
        - archive
      loop_control:
        index_var: loop_index
      when: item not in existing_scrub_pool_names

    # ------------------------------------------------------------------ #
    # S.M.A.R.T.
    # ------------------------------------------------------------------ #
    # Kein midclt-Endpoint für SMART-Test-Schedules verfügbar.
    # Manuell in der UI konfigurieren:
    # Data Protection → S.M.A.R.T. Tests → Add
    # Empfehlung: SHORT weekly (Sonntag 01:00), LONG monthly (1. des Monats 02:00)

    # ------------------------------------------------------------------ #
    # VMs
    # ------------------------------------------------------------------ #
    # Disk-Layout:
    #   Media VM: data/vms/mediastack-os (50GB zvol, OS)
    #             data/mediastack/mediastack-downloads (100GB zvol, Downloads)
    #
    # OS-Installation erfolgt via netboot.xyz (P1-28).

    - name: Existierende VMs abfragen
      command: midclt call vm.query
      register: existing_vms_raw
      changed_when: false

    - name: Media VM anlegen
      command: midclt call vm.create '{{ vm_body | to_json }}'
      vars:
        vm_body:
          name: mediastack
          description: "Plex + NZBGet"
          vcpus: 8
          cores: 8
          memory: 16384
          autostart: true
          cpu_mode: HOST-PASSTHROUGH
          bootloader: UEFI
      register: media_vm
      when: "'mediastack' not in (existing_vms_raw.stdout | from_json | map(attribute='name') | list)"

    - name: Media VM — OS-Disk (50GB zvol auf data)
      shell: >
        midclt call vm.device.create
        '{"vm": {{ (media_vm.stdout | from_json).id | int }}, "attributes": {"dtype": "DISK", "type": "AHCI", "path": "/dev/zvol/data/vms/mediastack-os"}}'
      when: media_vm is changed

    - name: Media VM — NIC
      shell: >
        midclt call vm.device.create
        '{"vm": {{ (media_vm.stdout | from_json).id | int }}, "attributes": {"dtype": "NIC", "type": "VIRTIO", "nic_attach": "{{ truenas_vm_bridge }}", "mac": "{{ mediastack_vm_mac }}"}}'
      when: media_vm is changed

    - name: Media VM — Display (VNC)
      shell: >
        midclt call vm.device.create
        '{"vm": {{ (media_vm.stdout | from_json).id | int }}, "attributes": {"dtype": "DISPLAY", "type": "SPICE", "port": 5902, "bind": "0.0.0.0", "wait": false, "resolution": "1024x768", "web": true, "password": "{{ truenas_vm_vnc_password }}"}}'
      when: media_vm is changed

    # GPU-Passthrough vorerst deaktiviert — Ryzen 7 3700X hat kein iGPU,
    # TrueNAS verweigert Passthrough der einzigen GPU (P1-15 ⚠️)


    - name: Media VM — Downloads-Disk (100GB zvol auf data)
      shell: >
        midclt call vm.device.create
        '{"vm": {{ (media_vm.stdout | from_json).id | int }}, "attributes": {"dtype": "DISK", "type": "AHCI", "path": "/dev/zvol/data/mediastack/mediastack-downloads"}}'
      when: media_vm is changed

    - name: Media VM — Plex-Config-Disk (80GB zvol auf data)
      shell: >
        midclt call vm.device.create
        '{"vm": {{ (media_vm.stdout | from_json).id | int }}, "attributes": {"dtype": "DISK", "type": "AHCI", "path": "/dev/zvol/data/mediastack/mediastack-plexdb"}}'
      when: media_vm is changed

    # ------------------------------------------------------------------ #
    # VM Devices idempotent sicherstellen (für bestehende VMs)
    # ------------------------------------------------------------------ #
    - name: mediastack VM-ID ermitteln
      set_fact:
        mediastack_vm_id: "{{ (existing_vms_raw.stdout | from_json | selectattr('name', 'equalto', 'mediastack') | list)[0].id }}"
      when: "'mediastack' in (existing_vms_raw.stdout | from_json | map(attribute='name') | list)"

    - name: mediastack VM-Devices abfragen
      command: midclt call vm.device.query '[["vm","=",{{ mediastack_vm_id }}]]'
      register: existing_vm_devices_raw
      changed_when: false
      when: mediastack_vm_id is defined

    - name: Media VM — NIC anlegen falls fehlend
      shell: >
        midclt call vm.device.create
        '{"vm": {{ mediastack_vm_id | int }}, "attributes": {"dtype": "NIC", "type": "VIRTIO", "nic_attach": "{{ truenas_vm_bridge }}", "mac": "{{ mediastack_vm_mac }}"}}'
      when:
        - mediastack_vm_id is defined
        - existing_vm_devices_raw is defined
        - (existing_vm_devices_raw.stdout | from_json | selectattr('attributes.dtype', 'equalto', 'NIC') | list | length) == 0

    - name: Media VM — Plex-Config-Disk anlegen falls fehlend
      shell: >
        midclt call vm.device.create
        '{"vm": {{ mediastack_vm_id | int }}, "attributes": {"dtype": "DISK", "type": "AHCI", "path": "/dev/zvol/data/mediastack/mediastack-plexdb"}}'
      when:
        - mediastack_vm_id is defined
        - existing_vm_devices_raw is defined
        - (existing_vm_devices_raw.stdout | from_json | selectattr('attributes.dtype', 'equalto', 'DISK') | selectattr('attributes.path', 'equalto', '/dev/zvol/data/mediastack/mediastack-plexdb') | list | length) == 0

    - name: Media VM — NIC aktualisieren falls Bridge falsch
      shell: >
        midclt call vm.device.update
        '{{ nic_device.id }}'
        '{"attributes": {"type": "VIRTIO", "nic_attach": "{{ truenas_vm_bridge }}", "mac": "{{ mediastack_vm_mac }}"}}'
      vars:
        nic_device: "{{ existing_vm_devices_raw.stdout | from_json | selectattr('attributes.dtype', 'equalto', 'NIC') | list | first }}"
      when:
        - mediastack_vm_id is defined
        - existing_vm_devices_raw is defined
        - (existing_vm_devices_raw.stdout | from_json | selectattr('attributes.dtype', 'equalto', 'NIC') | list | length) > 0
        - (existing_vm_devices_raw.stdout | from_json | selectattr('attributes.dtype', 'equalto', 'NIC') | list | first).attributes.nic_attach != truenas_vm_bridge

    # ------------------------------------------------------------------ #
    # Disk-Monitor
    # ------------------------------------------------------------------ #
    - name: Disk-Monitor Script deployen
      copy:
        src: files/disk-monitor.sh
        dest: /root/disk-monitor.sh
        owner: root
        group: root
        mode: "0750"

    - name: Gotify-Token in Disk-Monitor Script setzen
      lineinfile:
        path: /root/disk-monitor.sh
        regexp: '^GOTIFY_TOKEN='
        line: 'GOTIFY_TOKEN="{{ disk_monitor_gotify_token }}"'

    - name: State-Verzeichnis anlegen
      file:
        path: /root/disk-monitor-state
        state: directory
        owner: root
        mode: "0700"

    - name: Existierende Cron-Jobs abfragen
      command: midclt call cronjob.query
      register: existing_cronjobs_raw
      changed_when: false

    - name: Disk-Monitor Cron-Job anlegen
      command: midclt call cronjob.create '{{ cronjob_body | to_json }}'
      vars:
        cronjob_body:
          user: root
          command: /bin/bash /root/disk-monitor.sh
          description: Disk Monitor
          enabled: true
          stdout: true
          stderr: false
          schedule:
            minute: "0"
            hour: "12"
            dom: "*"
            month: "*"
            dow: "*"
      when: >
        (existing_cronjobs_raw.stdout | from_json |
         selectattr('command', 'equalto', '/bin/bash /root/disk-monitor.sh') |
         list | length) == 0

    # ------------------------------------------------------------------ #
    # Netzwerk
    # ------------------------------------------------------------------ #
    # ⚠️  Diese Tasks ans Ende — Commit bricht SSH-Verbindung kurz ab.
    #     Alles oberhalb ist dann bereits konfiguriert.

    - name: Hostname, Gateway und DNS konfigurieren
      command: midclt call network.configuration.update '{{ net_body | to_json }}'
      vars:
        net_body:
          hostname: "{{ truenas_hostname }}"
          domain: "{{ truenas_domain }}"
          ipv4gateway: "{{ truenas_gateway }}"
          nameserver1: "{{ truenas_nameserver1 }}"

    - name: Alle Interfaces abfragen
      command: midclt call interface.query
      register: all_interfaces_raw
      changed_when: false

    - name: Interface-Fakten setzen
      set_fact:
        iface_physical: "{{ all_interfaces_raw.stdout | from_json | selectattr('name', 'equalto', truenas_physical_interface) | list | first | default({}) }}"
        iface_bridge: "{{ all_interfaces_raw.stdout | from_json | selectattr('name', 'equalto', truenas_bridge) | list | first | default({}) }}"

    - name: Bridge {{ truenas_bridge }} anlegen ({{ truenas_physical_interface }} als Member)
      command: >
        midclt call interface.create
        '{"name": "{{ truenas_bridge }}", "type": "BRIDGE", "bridge_members": ["{{ truenas_physical_interface }}"]}'
      register: bridge_created
      when: iface_bridge == {}

    - name: IP vom physischen Interface entfernen (DHCP + statische Aliases)
      command: >
        midclt call interface.update
        '"{{ truenas_physical_interface }}"'
        '{"ipv4_dhcp": false, "ipv6_auto": false, "aliases": []}'
      register: physical_iface_updated
      when: iface_physical.ipv4_dhcp | default(false) or (iface_physical.aliases | default([]) | length > 0)

    - name: Statische IP auf Bridge setzen
      command: >
        midclt call interface.update
        '"{{ truenas_bridge }}"'
        '{{ iface_body | to_json }}'
      vars:
        iface_body:
          aliases:
            - address: "{{ truenas_ip }}"
              netmask: "{{ truenas_netmask }}"
              type: INET
        current_aliases: "{{ iface_bridge.aliases | default([]) }}"
        ip_already_set: "{{ current_aliases | selectattr('address', 'equalto', truenas_ip) | list | length > 0 }}"
      register: bridge_ip_updated
      when: not ip_already_set

    - name: Interface-Änderungen committen (rollback nach 120s falls kein Checkin)
      command: midclt call interface.commit '{{ commit_body | to_json }}'
      vars:
        commit_body:
          rollback: true
          checkin_timeout: 120
      ignore_errors: true
      when: bridge_created is changed or physical_iface_updated is changed or bridge_ip_updated is changed

    - name: Warten — Konnektivität prüfen (120s bis automatischer Rollback)
      pause:
        prompt: "Verbindung OK? Enter drücken um mit 'interface.checkin' zu bestätigen (sonst 120s warten für Rollback)"
      when: bridge_created is changed or physical_iface_updated is changed or bridge_ip_updated is changed

    - name: Interface-Änderungen bestätigen (kein Rollback)
      command: midclt call interface.checkin
      ignore_errors: true
      when: bridge_created is changed or physical_iface_updated is changed or bridge_ip_updated is changed
