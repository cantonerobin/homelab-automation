---
# Configuration via SSH + midclt
# Prerequisite: SSH enabled + ansible.pub added for root user (manually via WebUI)
#
# Selective execution via tags:
#   --tags storage      disk/pool/dataset/zvol
#   --tags users        media + nextcloud users
#   --tags nfs          NFS service + shares + ownership
#   --tags schedules    snapshot + scrub tasks
#   --tags vms          VM creation + device idempotency
#   --tags acme         Step-CA root cert + ACME certificate pipeline
#   --tags monitoring   disk-monitor script + cron job
#   --tags network      hostname, interfaces, bridges, IPs
#   --skip-tags network safe re-run without interactive checkin pause

- name: Configure TrueNAS
  hosts: truenas
  gather_facts: false
  vars_files:
    - vars/config.yml
    - vars/secrets.yml

  tasks:
    - import_tasks: tasks/storage.yml
      tags: storage

    - import_tasks: tasks/users.yml
      tags: users

    - import_tasks: tasks/nfs.yml
      tags: nfs

    - import_tasks: tasks/schedules.yml
      tags: schedules

    - import_tasks: tasks/vms.yml
      tags: vms

    - import_tasks: tasks/acme.yml
      tags: acme

    - import_tasks: tasks/monitoring.yml
      tags: monitoring

    # ⚠️ Network goes near-last — commit/checkin briefly interrupts SSH.
    - import_tasks: tasks/network.yml
      tags: network

    # ⚠️ Must run after network — br30 must exist before NIC attachment/update.
    - import_tasks: tasks/vm_devices.yml
      tags: vms
