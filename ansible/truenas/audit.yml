---
# Checks whether more resources exist on TrueNAS than expected according to config.yml.
# Read-only — no changes.
#
# Run:
#   ansible-playbook ansible/truenas/audit.yml
#
# Tags match configure.yml for consistency:
#   --tags storage   pool + dataset + zvol checks
#   --tags nfs       NFS share checks

- name: TrueNAS Audit
  hosts: truenas
  gather_facts: false
  vars_files:
    - vars/config.yml

  tasks:
    - import_tasks: tasks/audit_storage.yml
      tags: storage

    - import_tasks: tasks/audit_nfs.yml
      tags: nfs
