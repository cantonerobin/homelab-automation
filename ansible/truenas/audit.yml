---
# Checks whether more resources exist on TrueNAS than expected according to config.yml.
# Read-only — no changes.

- name: TrueNAS Audit
  hosts: truenas
  gather_facts: false
  vars_files:
    - vars/config.yml

  tasks:

    # ------------------------------------------------------------------ #
    # Pools
    # ------------------------------------------------------------------ #
    - name: Query pools
      command: midclt call pool.query
      register: pools_raw
      changed_when: false

    - name: Check for unknown pools
      vars:
        expected_pools: ["data", "archive"]
        existing_pools: "{{ pools_raw.stdout | from_json | map(attribute='name') | list }}"
        extra_pools: "{{ existing_pools | reject('in', expected_pools) | list }}"
      debug:
        msg: "⚠️  Unknown pools: {{ extra_pools }}"
      when: extra_pools | length > 0

    - name: Pools OK
      vars:
        expected_pools: ["data", "archive"]
        existing_pools: "{{ pools_raw.stdout | from_json | map(attribute='name') | list }}"
        extra_pools: "{{ existing_pools | reject('in', expected_pools) | list }}"
      debug:
        msg: "✅ Pools: no unknown entries"
      when: extra_pools | length == 0

    # ------------------------------------------------------------------ #
    # Datasets & Zvols
    # ------------------------------------------------------------------ #
    - name: Query datasets
      command: midclt call pool.dataset.query
      register: datasets_raw
      changed_when: false

    - name: Check for unknown datasets/zvols
      vars:
        expected_names: >-
          {{
            (datasets | map(attribute='name') | list)
            + (zvols | map(attribute='name') | list)
            + ['data', 'archive']
          }}
        existing_names: "{{ datasets_raw.stdout | from_json | map(attribute='name') | list }}"
        extra_names: "{{ existing_names | reject('in', expected_names) | list }}"
      debug:
        msg: "⚠️  Unknown datasets/zvols: {{ extra_names }}"
      when: extra_names | length > 0

    - name: Datasets/Zvols OK
      vars:
        expected_names: >-
          {{
            (datasets | map(attribute='name') | list)
            + (zvols | map(attribute='name') | list)
            + ['data', 'archive']
          }}
        existing_names: "{{ datasets_raw.stdout | from_json | map(attribute='name') | list }}"
        extra_names: "{{ existing_names | reject('in', expected_names) | list }}"
      debug:
        msg: "✅ Datasets/Zvols: no unknown entries"
      when: extra_names | length == 0

    # ------------------------------------------------------------------ #
    # NFS Shares
    # ------------------------------------------------------------------ #
    - name: Query NFS shares
      command: midclt call sharing.nfs.query
      register: nfs_raw
      changed_when: false

    - name: Check for unknown NFS shares
      vars:
        expected_paths: "{{ nfs_shares | map(attribute='path') | list }}"
        existing_paths: "{{ nfs_raw.stdout | from_json | map(attribute='path') | list }}"
        extra_paths: "{{ existing_paths | reject('in', expected_paths) | list }}"
      debug:
        msg: "⚠️  Unknown NFS shares: {{ extra_paths }}"
      when: extra_paths | length > 0

    - name: NFS Shares OK
      vars:
        expected_paths: "{{ nfs_shares | map(attribute='path') | list }}"
        existing_paths: "{{ nfs_raw.stdout | from_json | map(attribute='path') | list }}"
        extra_paths: "{{ existing_paths | reject('in', expected_paths) | list }}"
      debug:
        msg: "✅ NFS shares: no unknown entries"
      when: extra_paths | length == 0
