- name: Add argo helm repo
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Install ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "10.1.2"
    release_namespace: argocd
    create_namespace: true
    values_files:
      - "{{ playbook_dir }}/../k3s/infrastructure/argocd/values.yaml"
    values:
      configs:
        secret:
          argocdServerAdminPassword: "{{ argocd_admin_password_bcrypt }}"

- name: Deploy ArgoCD GitLab repository credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: repo-gitlab-infrastructure
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: git@gitlab.com:homelab5023328/infrastructure.git
        sshPrivateKey: "{{ lookup('file', playbook_dir + '/../ssh/gitlab') }}"

- name: Apply ArgoCD root ApplicationSet
  kubernetes.core.k8s:
    src: "{{ playbook_dir }}/../k3s/bootstrap/root-app.yml"
    state: present
