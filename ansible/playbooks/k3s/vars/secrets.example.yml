# Back up in Proton Pass.

# ArgoCD admin password (bcrypt hash, cost 10)
# Generate on Linux/macOS:
#   htpasswd -nbBC 10 "" YOUR_PASSWORD | tr -d ':\n' | sed 's/$2y/$2a/'
# Or with Python:
#   python3 -c "import bcrypt; print(bcrypt.hashpw(b'YOUR_PASSWORD', bcrypt.gensalt(10)).decode())"
# ⚠️ ArgoCD requires $2a format (not $2y) — the sed command handles this.
argocd_admin_password_bcrypt: ""
