---
# Install and configure AdGuard Home on Pi 1 (primary) and Pi 2 (secondary).
#
# Prerequisites:
#   - bootstrap.yml run — SSH key deployed, static IPs set, hostnames configured
#   - Pis reachable at 192.168.1.2 (pi01) and 192.168.1.3 (pi02)
#   - vars/adguard.yml: replace adguard_admin_password_hash before running
#
# Run:
#   ansible-playbook ansible/pi/adguard.yml
#
# The config (AdGuardHome.yaml) is deployed once (force: false).
# To reset to IaC state: rm /opt/AdGuardHome/AdGuardHome.yaml && re-run.
#
# AdGuard Home Web UI after setup:
#   Pi 1: http://192.168.1.2:3000
#   Pi 2: http://192.168.1.3:3000

- name: Install and configure AdGuard Home
  hosts: dns
  become: true
  vars_files:
    - vars/adguard.yml

  tasks:

    # ── Binary ────────────────────────────────────────────────────────────────

    - name: Check if AdGuard Home binary exists
      ansible.builtin.stat:
        path: /opt/AdGuardHome/AdGuardHome
      register: adguard_binary

    - name: Get installed AdGuard Home version
      ansible.builtin.command: /opt/AdGuardHome/AdGuardHome --version
      register: adguard_installed_version
      changed_when: false
      when: adguard_binary.stat.exists

    - name: Set needs_install fact
      ansible.builtin.set_fact:
        adguard_needs_install: >-
          {{ not adguard_binary.stat.exists or
             adguard_version not in (adguard_installed_version.stdout | default('')) }}

    - name: Download AdGuard Home {{ adguard_version }}
      ansible.builtin.get_url:
        url: "https://github.com/AdguardTeam/AdGuardHome/releases/download/\
              {{ adguard_version }}/AdGuardHome_linux_arm64.tar.gz"
        dest: /tmp/AdGuardHome.tar.gz
        mode: "0644"
      when: adguard_needs_install

    - name: Extract AdGuard Home tarball
      ansible.builtin.unarchive:
        src: /tmp/AdGuardHome.tar.gz
        dest: /tmp/
        remote_src: true
      when: adguard_needs_install

    - name: Ensure AdGuard Home install directory exists
      ansible.builtin.file:
        path: /opt/AdGuardHome
        state: directory
        mode: "0755"

    - name: Stop AdGuard Home service before binary update
      ansible.builtin.systemd:
        name: AdGuardHome
        state: stopped
      ignore_errors: true
      when: adguard_needs_install and adguard_binary.stat.exists

    - name: Install AdGuard Home binary
      ansible.builtin.copy:
        src: /tmp/AdGuardHome/AdGuardHome
        dest: /opt/AdGuardHome/AdGuardHome
        remote_src: true
        mode: "0755"
      when: adguard_needs_install

    # ── Config ────────────────────────────────────────────────────────────────

    - name: Deploy AdGuard Home config (initial — not overwritten on re-runs)
      ansible.builtin.template:
        src: templates/adguardhome.yaml.j2
        dest: /opt/AdGuardHome/AdGuardHome.yaml
        mode: "0600"
        force: false
      notify: Restart AdGuard Home

    # ── Service ───────────────────────────────────────────────────────────────

    - name: Register AdGuard Home as systemd service
      ansible.builtin.command: /opt/AdGuardHome/AdGuardHome -s install
      args:
        creates: /etc/systemd/system/AdGuardHome.service
      notify: Restart AdGuard Home

    - name: Enable and start AdGuard Home
      ansible.builtin.systemd:
        name: AdGuardHome
        enabled: true
        state: started
        daemon_reload: true

    # ── Cleanup ───────────────────────────────────────────────────────────────

    - name: Remove downloaded tarball
      ansible.builtin.file:
        path: /tmp/AdGuardHome.tar.gz
        state: absent
      when: adguard_needs_install

  handlers:
    - name: Restart AdGuard Home
      ansible.builtin.systemd:
        name: AdGuardHome
        state: restarted
