---
# AdGuard Home variables
#
# !! Replace adguard_admin_password_hash before running !!
# !! Consider encrypting this file with ansible-vault   !!
#
# Generate bcrypt hash (rounds=10):
#   python3 -c "import bcrypt; print(bcrypt.hashpw(b'yourpassword', bcrypt.gensalt(rounds=10)).decode())"
#   or: htpasswd -nbBC 10 "" yourpassword | tr -d ':\n'


adguard_version: "v0.107.57"
adguard_sync_version: "v0.9.0"

adguard_admin_user: admin
# Bcrypt hash of admin password — REPLACE THIS PLACEHOLDER
adguard_admin_password_hash: "$2b$10$CTTM54N0SfcYXZu5j/5AX.69g/m2y32dfmlCK23aDNkxdopAhI4rG"

adguard_upstream_dns:
  - "tls://dns.cloudflare.com"
  - "tls://dns.quad9.net"

adguard_bootstrap_dns:
  - "1.1.1.1"
  - "9.9.9.9"
  - "2606:4700:4700::1111"
  - "2620:fe::fe"

adguard_filter_lists:
  - id: 1
    name: "AdGuard DNS filter"
    url: "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt"
    enabled: true
  - id: 2
    name: "AdGuard DNS Popup Hosts filter"
    url: "https://adguardteam.github.io/HostlistsRegistry/assets/filter_59.txt"
    enabled: true
  - id: 3
    name: "Peter Lowe's Ad and tracking server list"
    url: "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=adblockplus&showintro=1&mimetype=plaintext"
    enabled: true
  - id: 4
    name: "EasyPrivacy"
    url: "https://easylist.to/easylist/easyprivacy.txt"
    enabled: true
  - id: 5
    name: "Steven Black's unified hosts (ads + tracking)"
    url: "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
    enabled: false  # large list — enable if needed

# Local DNS rewrites — internal cantone.net services only.
# Public DNS (Cloudflare) is managed manually for now — B-17 tracks migration to Terraform.
# Split-DNS: entries listed here override public DNS for internal clients.
# Services with public Cloudflare records but NO internal entry (intentional — public resolves):
#   notifications.cantone.net → Cloudflare only (public IP → port forward → nginx → gotify.cantone.net)
#   monitor.cantone.net       → Cloudflare only (public IP → port forward → nginx → uptimekuma.cantone.net)
adguard_local_rewrites:
  # PVE nodes (Management VLAN 192.168.1.x)
  - domain: "helix.cantone.net"
    answer: "192.168.1.10"
  - domain: "vega.cantone.net"
    answer: "192.168.1.11"
  - domain: "nova.cantone.net"
    answer: "192.168.1.12"
  - domain: "truenas.cantone.net"
    answer: "192.168.10.25"
  # Raspberry Pis (Management VLAN 192.168.1.x)
  - domain: "pi01.cantone.net"
    answer: "192.168.1.2"
  - domain: "adguard01.cantone.net"
    answer: "192.168.1.2"
  - domain: "pi02.cantone.net"
    answer: "192.168.1.3"
  - domain: "adguard02.cantone.net"
    answer: "192.168.1.3"
  # Services (Server VLAN / DMZ)
  - domain: "proxy.cantone.net"
    answer: "192.168.30.75"
  - domain: "step-ca.cantone.net"
    answer: "192.168.10.56"
  - domain: "gotify.cantone.net"
    answer: "192.168.30.52"
  - domain: "dash.cantone.net"
    answer: "192.168.10.93"
  - domain: "cloudflare-ddns.cantone.net"
    answer: "192.168.10.78"
  - domain: "uptimekuma.cantone.net"
    answer: "192.168.10.91"
  - domain: "nextcloud.cantone.net"
    answer: "192.168.30.82"
  - domain: "homeassistant.cantone.net"
    answer: "192.168.10.61"
  - domain: "dev.cantone.net"
    answer: "192.168.10.50"


  # PTR records (reverse DNS) — host canonical name per IP
  # Management VLAN 192.168.1.x
  - domain: "2.1.168.192.in-addr.arpa"
    answer: "pi01.cantone.net"
  - domain: "3.1.168.192.in-addr.arpa"
    answer: "pi02.cantone.net"
  # PVE nodes — Management VLAN 192.168.1.x
  - domain: "10.1.168.192.in-addr.arpa"
    answer: "helix.cantone.net"
  - domain: "11.1.168.192.in-addr.arpa"
    answer: "vega.cantone.net"
  - domain: "12.1.168.192.in-addr.arpa"
    answer: "nova.cantone.net"
  - domain: "25.10.168.192.in-addr.arpa"
    answer: "truenas.cantone.net"
  - domain: "56.10.168.192.in-addr.arpa"
    answer: "step-ca.cantone.net"
  - domain: "61.10.168.192.in-addr.arpa"
    answer: "homeassistant.cantone.net"
  - domain: "78.10.168.192.in-addr.arpa"
    answer: "cloudflare-ddns.cantone.net"
  - domain: "91.10.168.192.in-addr.arpa"
    answer: "uptimekuma.cantone.net"
  - domain: "93.10.168.192.in-addr.arpa"
    answer: "dash.cantone.net"
  - domain: "habit-tracker.cantone.net"
    answer: "192.168.30.69"
  # DMZ 192.168.30.x
  - domain: "75.30.168.192.in-addr.arpa"
    answer: "proxy.cantone.net"
  - domain: "82.30.168.192.in-addr.arpa"
    answer: "nextcloud.cantone.net"
  - domain: "52.30.168.192.in-addr.arpa"
    answer: "gotify.cantone.net"
  - domain: "69.30.168.192.in-addr.arpa"
    answer: "habit-tracker.cantone.net"
  # k3s VMs — VLAN 10 (Server, primary management interface)
  - domain: "k3s-nova.cantone.net"
    answer: "192.168.10.30"
  - domain: "k3s-helix.cantone.net"
    answer: "192.168.10.31"
  - domain: "k3s-vega.cantone.net"
    answer: "192.168.10.32"
  - domain: "30.10.168.192.in-addr.arpa"
    answer: "k3s-nova.cantone.net"
  - domain: "31.10.168.192.in-addr.arpa"
    answer: "k3s-helix.cantone.net"
  - domain: "32.10.168.192.in-addr.arpa"
    answer: "k3s-vega.cantone.net"

  # k3s VMs — VLAN 5 (k3s Network)
  - domain: "k3s-nova-cluster.cantone.net"
    answer: "192.168.5.30"
  - domain: "k3s-helix-cluster.cantone.net"
    answer: "192.168.5.31"
  - domain: "k3s-vega-cluster.cantone.net"
    answer: "192.168.5.32"
  - domain: "30.5.168.192.in-addr.arpa"
    answer: "k3s-nova-cluster.cantone.net"
  - domain: "31.5.168.192.in-addr.arpa"
