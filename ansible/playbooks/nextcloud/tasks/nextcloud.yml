---
# docker_compose_dir (/opt/nextcloud) is created by the docker_host role.

- name: Pre-create subdirectories on NFS mounts
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ nextcloud_config_mount }}/mastercontainer"
    - "{{ nextcloud_config_mount }}/nextcloud-app"
    - "{{ nextcloud_db_mount }}/database"
    - "{{ nextcloud_db_mount }}/database-dump"

- name: Pre-create nextcloud_aio_mastercontainer volume on NFS
  command: >
    docker volume create
    --driver local --opt type=none --opt o=bind
    --opt device={{ nextcloud_config_mount }}/mastercontainer
    nextcloud_aio_mastercontainer
  changed_when: false

- name: Pre-create nextcloud_aio_nextcloud volume on NFS
  command: >
    docker volume create
    --driver local --opt type=none --opt o=bind
    --opt device={{ nextcloud_config_mount }}/nextcloud-app
    nextcloud_aio_nextcloud
  changed_when: false

- name: Pre-create nextcloud_aio_database volume on NFS
  command: >
    docker volume create
    --driver local --opt type=none --opt o=bind
    --opt device={{ nextcloud_db_mount }}/database
    nextcloud_aio_database
  changed_when: false

- name: Pre-create nextcloud_aio_database_dump volume on NFS
  command: >
    docker volume create
    --driver local --opt type=none --opt o=bind
    --opt device={{ nextcloud_db_mount }}/database-dump
    nextcloud_aio_database_dump
  changed_when: false

- name: Deploy docker-compose.yml
  copy:
    dest: "{{ docker_compose_dir }}/docker-compose.yml"
    mode: "0644"
    content: |
      services:
        nextcloud-aio-mastercontainer:
          image: nextcloud/all-in-one:latest
          init: true
          restart: always
          container_name: nextcloud-aio-mastercontainer
          volumes:
            - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
            - /var/run/docker.sock:/var/run/docker.sock:ro
          ports:
            - 80:80
            - 8080:8080
            - 8443:8443
          environment:
            - AIO_DISABLE_BACKUP_SECTION=true
            - APACHE_PORT=11000
            - NEXTCLOUD_DATADIR={{ nextcloud_data_mount }}
            - NEXTCLOUD_DOMAIN={{ nextcloud_domain }}

      volumes:
        nextcloud_aio_mastercontainer:
          name: nextcloud_aio_mastercontainer
          external: true

- name: Start Nextcloud AIO
  command: docker compose up -d
  args:
    chdir: "{{ docker_compose_dir }}"
  changed_when: true
