# TrueNAS connection
truenas_url: "https://192.168.10.25"
truenas_validate_certs: false  # self-signed cert

# SSH Private Key — must be in the WSL filesystem (not /mnt/c/), otherwise permissions error (0777)
ansible_ssh_key: "~/.ssh/ansible"

# Disk serial numbers — stable across reboots, independent of sda/sdb/etc. ordering
data_pool_serials:
  - ZW611XR4          # 3TB Seagate
  - WD-WCC4N0PU0J03   # 3TB WD
  - WD-WCC4N4CLA3YZ   # 3TB WD
  - WD-WCC4N3HVJ1FL   # 3TB WD
archive_pool_serial: 2327E6EB5451   # 2TB SSD

# Service Users (NFS mapall)
media_user:
  username: media
  uid: 1000

nextcloud_user:
  username: nextcloud
  uid: 1001

# NFS
nfs_allowed_network: "192.168.10.0/24"

# Directories in the mediastack-data dataset
mediastack_media_dirs:
  - audiobooks
  - movies
  - music
  - podcasts
  - tv

# Datasets
datasets:
  - name: data/mediastack
    snapshot: false        # Container dataset, no snapshot needed
  - name: data/mediastack/mediastack-config
    recordsize: 16K       # App configs (small files)
    snapshot: true
  - name: data/mediastack/mediastack-data
    recordsize: 512K
    atime: "OFF"
  - name: data/nextcloud
    snapshot: false        # Container dataset, no snapshot needed
  - name: data/nextcloud/nextcloud-data
    recordsize: 16K        # 80% of files < 16K (Nextcloud metadata, contacts, calendars, small docs)
    atime: "OFF"           # Nextcloud tracks access in DB — no need for ZFS atime writes
    snapshot: true
  - name: data/nextcloud/nextcloud-config
    recordsize: 4K         # Small AIO mastercontainer config files + Nextcloud app files
    snapshot: true
  - name: data/nextcloud/nextcloud-db
    recordsize: 16K        # MariaDB — InnoDB default page size is 16K
    atime: "OFF"
    snapshot: true
  - name: data/vms
    snapshot: false        # Container for VM zvols, no snapshot needed

# Zvol sizes
mediastack_downloads_disk_size_gb: 250
mediastack_plex_disk_size_gb: 80

# Zvols (VM OS disks under data/vms, downloads under data/mediastack)
zvols:
  - name: data/vms/mediastack-os
    volsize: 96636764160   # 90GB
    volblocksize: "16K"
    snapshot: true
  - name: data/mediastack/mediastack-downloads
    volsize: "{{ mediastack_downloads_disk_size_gb * 1024 * 1024 * 1024 }}"
    volblocksize: "16K"
    snapshot: false        # In-progress downloads only — no value as snapshot
  - name: data/mediastack/mediastack-plexdb
    volsize: "{{ mediastack_plex_disk_size_gb * 1024 * 1024 * 1024 }}"
    volblocksize: "16K"
    snapshot: true

# VMs
truenas_vm_bridge: "{{ truenas_dmz_bridge }}"   # mediastack VM lives in DMZ
mediastack_vm_mac: "00:a0:98:0c:f0:b1"

# NFS Shares
nfs_shares:
  - path: /mnt/data/mediastack/mediastack-config
    hosts:
      - "192.168.10.62"
      - "192.168.30.62"
    mapall_user: media
    mapall_group: media
  - path: /mnt/data/mediastack/mediastack-data
    hosts:
      - "192.168.10.62"
      - "192.168.30.62"
    mapall_user: media
    mapall_group: media
  - path: /mnt/data/nextcloud/nextcloud-data
    hosts:
      - "192.168.30.82"
    mapall_user: nextcloud
    mapall_group: nextcloud
  - path: /mnt/data/nextcloud/nextcloud-config
    hosts:
      - "192.168.30.82"
    mapall_user: nextcloud
    mapall_group: nextcloud
  - path: /mnt/data/nextcloud/nextcloud-db
    hosts:
      - "192.168.30.82"
    mapall_user: nextcloud
    mapall_group: nextcloud

# Step-CA / TLS
step_ca_acme_directory: "https://step-ca.cantone.net:9000/acme/acme/directory"
truenas_acme_dns_authenticator_id: 1    # TrueNAS ACME DNS authenticator — Cloudflare (ID 1)
