# Hetzner Storage Box (offsite backup — P1-29)
hetzner_storagebox_host: "u568390.your-storagebox.de"
hetzner_storagebox_user: "u568390"
hetzner_storagebox_port: 23
hetzner_storagebox_ssh_key: "ssh/truenas-hetzner"  # path relative to repo root (gitignored)

# Cloud Sync Tasks
# Encryption passwords in secrets.yml — ⚠️ also back up in Proton Pass!
# ⚠️ Remote folder paths must NOT have a leading slash — Hetzner SFTP treats home as root.
#    Leading slash causes SSH_FX_FAILURE on mkdir. Use relative paths (e.g. "backups/foo").
cloudsync_tasks:
  - description: "mediastack-config → Hetzner"
    path: "/mnt/data/mediastack/mediastack-config"
    folder: "backups/mediastack-config"
    snapshot: true
    schedule:
      minute: "0"
      hour: "2"
      dom: "*"
      month: "*"
      dow: "0"   # Sunday

  # Nextcloud (enable after P1-30 — datasets exist but may be empty until then)
  - description: "nextcloud-data → Hetzner"
    path: "/mnt/data/nextcloud/nextcloud-data"
    folder: "backups/nextcloud-data"
    snapshot: true
    schedule:
      minute: "0"
      hour: "3"
      dom: "*"
      month: "*"
      dow: "0"   # Sunday

  - description: "nextcloud-config → Hetzner"
    path: "/mnt/data/nextcloud/nextcloud-config"
    folder: "backups/nextcloud-config"
    snapshot: true
    schedule:
      minute: "30"
      hour: "3"
      dom: "*"
      month: "*"
      dow: "0"   # Sunday

  - description: "nextcloud-db → Hetzner"
    path: "/mnt/data/nextcloud/nextcloud-db"
    folder: "backups/nextcloud-db"
    snapshot: true   # ZFS snapshot before sync = consistent InnoDB point-in-time
    schedule:
      minute: "0"
      hour: "4"
      dom: "*"
      month: "*"
      dow: "0"   # Sunday

  # Phase 3: Longhorn backups (uncomment when P3-14 is done)
  # - description: "longhorn-backups → Hetzner"
  #   path: "/mnt/data/backups/longhorn"
  #   folder: "backups/longhorn"
  #   snapshot: false   # Longhorn backups are already point-in-time
  #   schedule:
  #     minute: "30"
  #     hour: "4"
  #     dom: "*"
  #     month: "*"
  #     dow: "0"   # Sunday

# Cloud Sync Restore Tasks (PULL from Hetzner → TrueNAS, disabled by default)
# ⚠️ Restore path must exist before running — ensured by the directory task in cloudsync_tasks.yml.
# To restore: enable task in TrueNAS UI or run: midclt call --job cloudsync.sync <id>
# After restore: copy files from restore_path to live path, then re-disable the task.
cloudsync_restore_tasks:
  - description: "RESTORE: Hetzner → mediastack-config"
    source_folder: "backups/mediastack-config"
    restore_path: "/mnt/data/restore/mediastack-config"

  - description: "RESTORE: Hetzner → nextcloud-data"
    source_folder: "backups/nextcloud-data"
    restore_path: "/mnt/data/restore/nextcloud-data"

  - description: "RESTORE: Hetzner → nextcloud-config"
    source_folder: "backups/nextcloud-config"
    restore_path: "/mnt/data/restore/nextcloud-config"

  - description: "RESTORE: Hetzner → nextcloud-db"
    source_folder: "backups/nextcloud-db"
    restore_path: "/mnt/data/restore/nextcloud-db"

# Network
truenas_hostname: "truenas"
truenas_domain: "cantone.net"
truenas_physical_interface: "enp6s0"   # physical NIC → becomes bridge member
truenas_bridge: "br1"                  # management bridge → gets the static IP
truenas_ip: "192.168.10.25"
truenas_netmask: 24
truenas_gateway: "192.168.10.1"
truenas_nameserver1: "192.168.10.1"

# DMZ network (VLAN 30) — for mediastack VM traffic
truenas_dmz_vlan_id: 30
truenas_dmz_vlan_interface: "enp6s0.30"   # logical name (TrueNAS will assign vlan0/vlan1/...)
truenas_dmz_bridge: "br30"               # bridge on top of VLAN interface — used by VMs
truenas_dmz_ip: "192.168.30.25"          # TrueNAS IP on br30 — NFS stays local, no router hop needed
truenas_dmz_netmask: 24
