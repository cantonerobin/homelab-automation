---
# Deploys truenas-monitor.sh — single script for all TrueNAS monitoring → Gotify.
# Covers: native alerts, cloud sync failures, UDMA_CRC delta, ATA hard resets.
# State directory: /root/truenas-monitor-state/
# Cron: every 5 minutes

- name: Deploy monitor script
  copy:
    src: files/truenas-monitor.sh
    dest: /root/truenas-monitor.sh
    owner: root
    group: root
    mode: "0750"

- name: Set Gotify token in monitor script
  lineinfile:
    path: /root/truenas-monitor.sh
    regexp: '^GOTIFY_TOKEN='
    line: 'GOTIFY_TOKEN="{{ truenas_monitor_gotify_token }}"'

- name: Create state directory
  file:
    path: /root/truenas-monitor-state
    state: directory
    owner: root
    mode: "0700"

- name: Query existing cron jobs
  command: midclt call cronjob.query
  register: existing_cronjobs_raw
  changed_when: false

- name: Create monitor cron job (every 5 minutes)
  command: midclt call cronjob.create '{{ cronjob_body | to_json }}'
  vars:
    cronjob_body:
      user: root
      command: /bin/bash /root/truenas-monitor.sh
      description: TrueNAS Monitor
      enabled: true
      stdout: false
      stderr: true
      schedule:
        minute: "*/5"
        hour: "*"
        dom: "*"
        month: "*"
        dow: "*"
  when: >
    (existing_cronjobs_raw.stdout | from_json |
     selectattr('command', 'equalto', '/bin/bash /root/truenas-monitor.sh') |
     list | length) == 0
