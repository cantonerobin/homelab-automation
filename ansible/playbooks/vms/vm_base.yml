---
- name: Ensure prerequisites on control node
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Install sshpass (for password auth during bootstrap)
      apt:
        name: sshpass
        state: present
      become: true
      when: ansible_pkg_mgr == 'apt'

- name: VM base configuration
  hosts: "{{ target | default('all') }}"
  become: true
  roles:
    - base
