---
# Migrate PVE node management interface from VLAN 10 (192.168.10.x) to VLAN 1 (192.168.1.x).
#
# Run ONE node at a time, coordinated with the Unifi switch port change:
#   ansible-playbook ansible/playbooks/proxmox/network.yml -l helix
#
# Procedure per node:
#   1. Run this playbook (writes config + backup, does not apply)
#   2. Verify /etc/network/interfaces diff looks correct
#   3. Change Unifi switch_office port to native VLAN 1 (PVE-Trunk-Mgmt profile)
#   4. ansible-playbook ansible/playbooks/proxmox/network.yml -l helix --tags apply
#      → Connection drops (normal). corosync shows node OFFLINE briefly.
#   5. Reconnect on new IP: ssh root@{{ pve_mgmt_ip }}
#   6. ansible-playbook ansible/playbooks/proxmox/network.yml -l helix --tags corosync
#      → Updates ring0_addr in corosync.conf + restarts corosync on all nodes.
#   7. Verify: pvecm status (all nodes online), ping 192.168.1.1
#
# Rollback (if step 5 fails):
#   - Revert Unifi port back to PVE-Trunk (native VLAN 10)
#   - On node via console: cp /etc/network/interfaces.bak /etc/network/interfaces && ifreload -a
#
# Node order: helix (Port 3) → nova (Port 2) → vega (Port 4)

- name: Migrate PVE management interface to VLAN 1
  hosts: proxmox
  become: true

  tasks:
    - name: Backup current network config
      ansible.builtin.copy:
        src: /etc/network/interfaces
        dest: /etc/network/interfaces.bak
        remote_src: true
        force: false

    - name: Update management IP in bridge config
      ansible.builtin.replace:
        path: /etc/network/interfaces
        regexp: 'address 192\.168\.10\.\d+/24'
        replace: "address {{ pve_mgmt_ip }}/24"
      register: ip_changed

    - name: Update gateway
      ansible.builtin.replace:
        path: /etc/network/interfaces
        regexp: 'gateway 192\.168\.10\.\d+'
        replace: "gateway {{ pve_mgmt_gateway }}"

    - name: Show config diff
      ansible.builtin.command: diff /etc/network/interfaces.bak /etc/network/interfaces
      register: diff_out
      changed_when: false
      failed_when: false

    - name: Print diff
      ansible.builtin.debug:
        msg: "{{ diff_out.stdout_lines }}"

    - name: Next step reminder
      ansible.builtin.debug:
        msg: >-
          Config written on {{ inventory_hostname }}.
          Now: (1) change Unifi port to native VLAN 1,
          then: (2) re-run with --tags apply.
          New IP will be: {{ pve_mgmt_ip }}
      when: ip_changed.changed

    - name: Apply network config (ifreload -a)
      ansible.builtin.command: ifreload -a
      tags: [apply, never]

    # --- corosync fix (run after reconnecting on new IP) ---

    - name: Read current corosync.conf
      ansible.builtin.slurp:
        src: /etc/pve/corosync.conf
      register: corosync_raw
      tags: [corosync, never]

    - name: Update ring0_addr for this node in corosync.conf
      ansible.builtin.replace:
        path: /etc/pve/corosync.conf
        # Matches the ring0_addr line that currently holds the old 192.168.10.x IP for this node.
        # Scoped to the exact old IP to avoid touching other nodes.
        regexp: "(ring0_addr:\\s*){{ ansible_host }}"
        replace: "\\g<1>{{ pve_mgmt_ip }}"
      register: corosync_changed
      tags: [corosync, never]

    - name: Increment corosync config_version
      ansible.builtin.replace:
        path: /etc/pve/corosync.conf
        regexp: '(config_version:\s*)(\d+)'
        replace: "\\g<1>{{ (corosync_raw['content'] | b64decode | regex_search('config_version:\\s*(\\d+)', '\\1') | first | int) + 1 }}"
      tags: [corosync, never]

    - name: Restart corosync on this node
      ansible.builtin.systemd:
        name: corosync
        state: restarted
      tags: [corosync, never]

    - name: Restart corosync on remaining cluster nodes
      ansible.builtin.systemd:
        name: corosync
        state: restarted
      delegate_to: "{{ item }}"
      loop: "{{ groups['proxmox'] | difference([inventory_hostname]) }}"
      tags: [corosync, never]

    - name: Wait for corosync to stabilise
      ansible.builtin.pause:
        seconds: 5
      tags: [corosync, never]

    - name: Verify cluster status
      ansible.builtin.command: pvecm status
      register: pvecm_out
      changed_when: false
      tags: [corosync, never]

    - name: Print cluster status
      ansible.builtin.debug:
        msg: "{{ pvecm_out.stdout_lines }}"
      tags: [corosync, never]
