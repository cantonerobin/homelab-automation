---
# Configure Proxmox VE nodes — P2-1 + P2-1a + B-50
#
# Idempotent — safe to run against existing nodes and freshly reinstalled nodes.
#
# Run all:
#   ansible-playbook ansible/playbooks/proxmox/configure.yml
# Run single node:
#   ansible-playbook ansible/playbooks/proxmox/configure.yml -l helix
# Tags:
#   --tags repos       Package repos only
#   --tags packages    Package installation only
#   --tags grub        GRUB kernel parameters only (requires reboot to take effect)
#   --tags nic         e1000e NIC fix: SmartPowerDown off, PCIe ASPM off (reboot required),
#                      TSO/GSO offload off via systemd unit (applies immediately)
#   --tags security    Unattended security updates only
#   --tags ssh         SSH hardening + fail2ban
#   --tags firewall    UFW firewall (run after P1.5-9 VLAN migration)

- name: Configure Proxmox VE nodes
  hosts: proxmox
  become: true

  tasks:

    # --- Package repositories ---

    - name: Remove PVE enterprise repos (old .list + new .sources format)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/pve-enterprise.sources
      tags: repos

    - name: Remove Ceph enterprise repos (old .list + new .sources format)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/ceph.list
        - /etc/apt/sources.list.d/ceph.sources
        - /etc/apt/sources.list.d/ceph-squid.list
        - /etc/apt/sources.list.d/ceph-squid.sources
      tags: repos

    - name: Clear legacy sources.list (replaced by debian.sources)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list
        content: ""
        mode: '0644'
      tags: repos

    - name: Remove legacy pve-no-subscription.list (replaced by proxmox.sources)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/pve-no-subscription.list
        state: absent
      tags: repos

    - name: Configure Debian base repos (DEB822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/debian.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: http://deb.debian.org/debian
          Suites: {{ ansible_distribution_release }} {{ ansible_distribution_release }}-updates
          Components: main contrib non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: http://security.debian.org/debian-security
          Suites: {{ ansible_distribution_release }}-security
          Components: main contrib non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      tags: repos

    - name: Configure PVE no-subscription repo (DEB822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/proxmox.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ ansible_distribution_release }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
      tags: repos

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: repos

    # --- Packages ---

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ifupdown2      # required for ifreload -a (network.yml)
          - curl
          - vim
          - htop
          - lsof
        state: present
      tags: packages

    # --- GRUB — APST fix for Samsung NVMe (safe to apply on all nodes) ---

    - name: Check if APST kernel parameter already present in GRUB
      ansible.builtin.command: grep -q 'nvme_core.default_ps_max_latency_us=0' /etc/default/grub
      register: apst_check
      changed_when: false
      failed_when: false
      tags: grub

    - name: Add APST parameter to GRUB_CMDLINE_LINUX_DEFAULT
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="[^"]*)"$'
        replace: '\1 nvme_core.default_ps_max_latency_us=0"'
      when: apst_check.rc != 0
      register: grub_changed
      tags: grub

    - name: Update GRUB
      ansible.builtin.command: update-grub
      when: grub_changed is changed
      tags: grub

    - name: Reboot reminder
      ansible.builtin.debug:
        msg: "GRUB updated on {{ inventory_hostname }} — reboot required for APST fix to take effect."
      when: grub_changed is changed
      tags: grub

    # --- e1000e NIC hang fix (all nodes — same i5-8500T hardware, same Intel i219 NIC) ---
    # Intel i219 NIC (e1000e driver) hangs under load, freezing the NIC and causing PVE
    # cluster quorum loss. Affects nova + helix confirmed (2026-06-14/2026-06-29/2026-07-09).
    # SmartPowerDownEnable=0 alone was not sufficient (helix hung again on 2026-07-09
    # under Terraform/Ansible network load) — added TSO/GSO offload disable + PCIe ASPM
    # off, both commonly cited fixes for this exact "Hardware Unit Hang" pattern on i219.
    # Requires reboot to take effect (GRUB param) / re-applies on every boot (systemd unit).

    - name: Deploy e1000e modprobe fix
      ansible.builtin.copy:
        dest: /etc/modprobe.d/e1000e.conf
        content: "options e1000e SmartPowerDownEnable=0\n"
        mode: '0644'
      register: e1000e_changed
      tags: nic

    - name: Update initramfs after e1000e fix
      ansible.builtin.command: update-initramfs -u
      when: e1000e_changed is changed
      tags: nic

    - name: Check if PCIe ASPM off kernel parameter already present in GRUB
      ansible.builtin.command: grep -q 'pcie_aspm=off' /etc/default/grub
      register: aspm_check
      changed_when: false
      failed_when: false
      tags: nic

    - name: Add PCIe ASPM off parameter to GRUB_CMDLINE_LINUX_DEFAULT
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="[^"]*)"$'
        replace: '\1 pcie_aspm=off"'
      when: aspm_check.rc != 0
      register: aspm_grub_changed
      tags: nic

    - name: Update GRUB after ASPM fix
      ansible.builtin.command: update-grub
      when: aspm_grub_changed is changed
      tags: nic

    - name: Reboot reminder (ASPM)
      ansible.builtin.debug:
        msg: "GRUB updated on {{ inventory_hostname }} — reboot required for PCIe ASPM off to take effect."
      when: aspm_grub_changed is changed
      tags: nic

    - name: Ensure ethtool is installed
      ansible.builtin.apt:
        name: ethtool
        state: present
      tags: nic

    - name: Deploy systemd unit to disable TSO/GSO offload on nic0 at boot
      ansible.builtin.copy:
        dest: /etc/systemd/system/e1000e-disable-offload.service
        mode: '0644'
        content: |
          [Unit]
          Description=Disable TSO/GSO offload on nic0 (e1000e Hardware Unit Hang mitigation)
          After=sys-subsystem-net-devices-nic0.device
          BindsTo=sys-subsystem-net-devices-nic0.device

          [Service]
          Type=oneshot
          RemainAfterExit=true
          ExecStart=/sbin/ethtool -K nic0 tso off gso off

          [Install]
          WantedBy=multi-user.target
      register: offload_unit_changed
      tags: nic

    - name: Reload systemd daemon after offload unit change
      ansible.builtin.systemd:
        daemon_reload: true
      when: offload_unit_changed is changed
      tags: nic

    - name: Enable and start TSO/GSO offload-disable service
      ansible.builtin.systemd:
        name: e1000e-disable-offload.service
        enabled: true
        state: started
      tags: nic

    # --- Unattended security updates (P2-1a) ---
    # Debian-Security origin only. No auto-reboot — rolling manual reboots.
    # PVE kernel + Ceph packages excluded (managed manually during Phase 2).

    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
      tags: security

    - name: Configure unattended-upgrades (Debian-Security only)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: '0644'
        content: |
          Unattended-Upgrade::Allowed-Origins {
            "Debian:{{ ansible_distribution_release }}-security";
          };
          Unattended-Upgrade::Package-Blacklist {
            "pve-kernel*";
            "proxmox-kernel*";
            "ceph*";
            "librados*";
            "librbd*";
          };
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::MinimalSteps "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "false";
          Unattended-Upgrade::Automatic-Reboot "false";
      tags: security

    - name: Configure apt auto-upgrade schedule
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
      tags: security

    # --- SSH hardening + fail2ban (B-50) ---
    # PermitRootLogin no globally, but root key-only allowed from peer IPs for live migration.
    # Drop-in file avoids touching /etc/ssh/sshd_config directly.

    - name: Deploy SSH hardening drop-in
      ansible.builtin.template:
        src: templates/sshd_hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        mode: '0600'
        owner: root
        group: root
      notify: Reload sshd
      tags: ssh

    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present
      tags: ssh

    - name: Configure fail2ban sshd jail
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.conf
        mode: '0644'
        content: |
          [sshd]
          enabled = true
          maxretry = 5
          bantime  = 3600
          findtime = 600
          ignoreip = 127.0.0.1/8 ::1 {{ pve_peer_ips }}
      notify: Restart fail2ban
      tags: ssh

    - name: Enable and start fail2ban
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started
      tags: ssh

    # --- UFW firewall (B-50) ---
    # DEFAULT_FORWARD_POLICY=ACCEPT required so UFW doesn't block VM bridge traffic.
    # Run --tags firewall only after P1.5-9 (all nodes on 192.168.1.x).
    # Requires: community.general collection (ansible-galaxy collection install community.general)

    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
      tags: firewall

    - name: Allow UFW to forward VM bridge traffic
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^DEFAULT_FORWARD_POLICY='
        line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
      notify: Reload ufw
      tags: firewall

    - name: UFW default deny incoming
      community.general.ufw:
        default: deny
        direction: incoming
      tags: firewall

    - name: UFW default allow outgoing
      community.general.ufw:
        default: allow
        direction: outgoing
      tags: firewall

    - name: UFW allow SSH from management VLAN
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp
        src: "{{ pve_firewall_mgmt_net }}"
        comment: "SSH - PVE nodes + admin tools from management VLAN"
      tags: firewall

    - name: UFW allow SSH from admin VLAN
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp
        src: "{{ pve_firewall_admin_net }}"
        comment: "SSH - Ansible + admin access from admin/client VLAN (interim until B-52 jump host)"
      tags: firewall

    - name: UFW allow PVE Web UI from management VLAN
      community.general.ufw:
        rule: allow
        port: '8006'
        proto: tcp
        src: "{{ pve_firewall_mgmt_net }}"
        comment: "PVE Web UI - management VLAN"
      tags: firewall

    - name: UFW allow PVE Web UI from admin VLAN
      community.general.ufw:
        rule: allow
        port: '8006'
        proto: tcp
        src: "{{ pve_firewall_admin_net }}"
        comment: "PVE Web UI - admin/client VLAN (interim until B-52 jump host)"
      tags: firewall

    - name: UFW allow Corosync from management VLAN
      community.general.ufw:
        rule: allow
        port: '5404:5405'
        proto: udp
        src: "{{ pve_firewall_mgmt_net }}"
        comment: "Corosync cluster heartbeat - management VLAN"
      tags: firewall

    - name: UFW allow VM live migration from management VLAN
      community.general.ufw:
        rule: allow
        port: '60000:60050'
        proto: tcp
        src: "{{ pve_firewall_mgmt_net }}"
        comment: "PVE live migration - management VLAN"
      tags: firewall

    - name: Enable UFW
      community.general.ufw:
        state: enabled
      tags: firewall

  handlers:

    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Reload ufw
      ansible.builtin.command: ufw reload
      changed_when: false
