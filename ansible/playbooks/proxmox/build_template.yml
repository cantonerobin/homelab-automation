---
# Builds both AlmaLinux 9 templates on all cluster nodes:
#   - alma9-template-v1      (CIS Level 1 hardened)
#   - alma9-template-dev-v1  (no hardening, for dev VMs)
#
# VM IDs are assigned dynamically per node via pvesh (cluster-wide unique).
# Nodes run sequentially (serial: 1) to avoid nextid race conditions.
# Terraform clones by name — all nodes get the same names, different IDs.
#
# Build all templates on all nodes:
#   ansible-playbook ansible/playbooks/proxmox/build_template.yml
#
# Single node:
#   ansible-playbook ansible/playbooks/proxmox/build_template.yml -l nova
#
# Force rebuild (destroys existing templates first):
#   ansible-playbook ansible/playbooks/proxmox/build_template.yml -e force_rebuild=true

# ── Play 1: Download image (parallel across all nodes) ─────────────────────────

- name: Download AlmaLinux image
  hosts: proxmox
  become: true
  gather_facts: false

  vars:
    base_dir: "/opt/proxmox-template-builder"
    image_dir: "/opt/proxmox-template-builder/images"
    snippet_dir: "/var/lib/vz/snippets"
    image_name: "AlmaLinux-9-GenericCloud-latest.x86_64.qcow2"
    image_url: "https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2"
    checksum_url: "https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/CHECKSUM"

  tasks:

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ base_dir }}"
        - "{{ image_dir }}"
        - "{{ snippet_dir }}"

    - name: Fetch upstream CHECKSUM
      ansible.builtin.uri:
        url: "{{ checksum_url }}"
        return_content: true
      register: checksum_file

    - name: Parse SHA256 hash
      ansible.builtin.set_fact:
        remote_sha256: "{{ checksum_file.content | regex_search('([a-f0-9]{64})\\s+' + image_name, '\\1') | first }}"

    - name: Download AlmaLinux image (skipped if checksum matches)
      ansible.builtin.get_url:
        url: "{{ image_url }}"
        dest: "{{ image_dir }}/{{ image_name }}"
        checksum: "sha256:{{ remote_sha256 }}"
        mode: "0644"
        timeout: 600

# ── Play 2: Build templates (all nodes in parallel) ────────────────────────────

- name: Build templates
  hosts: proxmox
  become: true
  gather_facts: false

  vars:
    force_rebuild: false
    storage: "local-lvm"
    bridge: "vmbr0"
    node_exporter_version: "1.8.2"
    image_dir: "/opt/proxmox-template-builder/images"
    image_name: "AlmaLinux-9-GenericCloud-latest.x86_64.qcow2"
    snippet_dir: "/var/lib/vz/snippets"
    templates:
      - name: "alma9-template-v1"
        cis_enabled: true
      - name: "alma9-template-dev-v1"
        cis_enabled: false

  tasks:

    - name: Build template
      ansible.builtin.include_tasks: tasks/build_single_template.yml
      loop: "{{ templates }}"
      loop_control:
        loop_var: tpl
        label: "{{ tpl.name }}"
