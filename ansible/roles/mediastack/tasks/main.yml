---
# ------------------------------------------------------------------ #
# Plex Config Disk (Zvol → /mnt/plex-config, no backup)
# ------------------------------------------------------------------ #

- name: Detect Plex config disk by size ({{ mediastack_plex_disk_size_gb }}GB)
  set_fact:
    mediastack_plex_disk: "/dev/{{ item.key }}"
  loop: "{{ ansible_devices | dict2items }}"
  when:
    - item.key is match('^sd')
    - item.value.partitions | length == 0
    - item.value.holders | length == 0
    - (item.value.size | regex_replace(' GB','') | float | round | int) == mediastack_plex_disk_size_gb

- name: Assert Plex config disk was found
  assert:
    that: mediastack_plex_disk is defined
    fail_msg: "No unpartitioned disk with {{ mediastack_plex_disk_size_gb }}GB found — is the zvol correctly configured in TrueNAS VM?"

- name: Format Plex config disk (only if empty)
  filesystem:
    fstype: xfs
    dev: "{{ mediastack_plex_disk }}"
    opts: "-L ms-plexdb"
    force: false

- name: Create mount point for Plex config disk
  file:
    path: "{{ mediastack_plex_mountpoint }}"
    state: directory
    owner: "{{ mediastack_puid }}"
    group: "{{ mediastack_pgid }}"
    mode: "0755"

- name: Mount Plex config disk and add to fstab
  mount:
    path: "{{ mediastack_plex_mountpoint }}"
    src: "LABEL=ms-plexdb"
    fstype: xfs
    opts: defaults,nofail
    state: mounted

# ------------------------------------------------------------------ #
# NZBGet Scratch Disk (Zvol → /mnt/media-download, no backup)
# ------------------------------------------------------------------ #

- name: Detect scratch disk by size ({{ mediastack_downloads_disk_size_gb }}GB)
  set_fact:
    mediastack_scratch_disk: "/dev/{{ item.key }}"
  loop: "{{ ansible_devices | dict2items }}"
  when:
    - item.key is match('^sd')
    - item.value.partitions | length == 0
    - item.value.holders | length == 0
    - (item.value.size | regex_replace(' GB','') | float | round | int) == mediastack_downloads_disk_size_gb

- name: Assert scratch disk was found
  assert:
    that: mediastack_scratch_disk is defined
    fail_msg: "No unpartitioned disk with {{ mediastack_downloads_disk_size_gb }}GB found — is the zvol correctly configured in TrueNAS VM?"

- name: Format scratch disk (only if empty)
  filesystem:
    fstype: xfs
    dev: "{{ mediastack_scratch_disk }}"
    opts: "-L ms-dl"
    force: false

- name: Create mount point for scratch disk
  file:
    path: "{{ mediastack_nzbget_tmp_mountpoint }}"
    state: directory
    owner: "{{ mediastack_puid }}"
    group: "{{ mediastack_pgid }}"
    mode: "0755"

- name: Mount scratch disk and add to fstab

  mount:
    path: "{{ mediastack_nzbget_tmp_mountpoint }}"
    src: "LABEL=ms-dl"
    fstype: xfs
    opts: defaults,nofail
    state: mounted

- name: Create directories on scratch disk (local XFS)
  file:
    path: "{{ mediastack_nzbget_tmp_mountpoint }}/{{ item }}"
    state: directory
    owner: "{{ mediastack_puid }}"
    group: "{{ mediastack_pgid }}"
    mode: "0755"
  become: true
  loop: "{{ mediastack_media_dirs }}"

- name: Create directories on media NFS mount (no chown — mapall via TrueNAS)
  file:
    path: "{{ mediastack_media_mountpoint }}/{{ item }}"
    state: directory
    mode: "0755"
  become: true
  loop: "{{ mediastack_media_dirs }}"

- name: Create NZBGet intermediate directory
  file:
    path: "{{ mediastack_nzbget_tmp_mountpoint }}/intermediate"
    state: directory
    owner: "{{ mediastack_puid }}"
    group: "{{ mediastack_pgid }}"
    mode: "0755"
  become: true

# ------------------------------------------------------------------ #
# .env File
# ------------------------------------------------------------------ #

- name: Deploy .env file
  template:
    src: .env.j2
    dest: "{{ mediastack_config_mountpoint }}/.env"
    mode: "0600"

# ------------------------------------------------------------------ #
# Docker Compose
# ------------------------------------------------------------------ #

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ mediastack_config_mountpoint }}/docker-compose.yml"
    mode: "0644"

# docker compose up is intentionally not run here — restore backup first, then start manually:
# cd /opt/mediastack && docker compose up -d

# ------------------------------------------------------------------ #
# NFS Mounts (TrueNAS datasets)
# ------------------------------------------------------------------ #

- name: Install nfs-utils
  dnf:
    name: nfs-utils
    state: present

- name: Create mount points for NFS
  file:
    path: "{{ item.mountpoint }}"
    state: directory
    mode: "0755"
  loop: "{{ nfs_mounts }}"

- name: Mount NFS shares and add to fstab
  mount:
    path: "{{ item.mountpoint }}"
    src: "{{ item.src }}"
    fstype: nfs
    opts: defaults,nofail,_netdev
    state: mounted
  loop: "{{ nfs_mounts }}"

# ------------------------------------------------------------------ #
# Firewall
# ------------------------------------------------------------------ #

- name: Install and start firewalld
  dnf:
    name: firewalld
    state: present

- name: Start and enable firewalld
  service:
    name: firewalld
    state: started
    enabled: true

- name: Open mediastack ports for proxy
  ansible.posix.firewalld:
    rich_rule: "rule family='ipv4' source address='{{ mediastack_proxy_ip }}' port port='{{ item }}' protocol='tcp' accept"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ mediastack_ports }}"

- name: Allow SSH (all sources)
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    immediate: true
    state: enabled
