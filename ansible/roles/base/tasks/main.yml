---
- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Install base packages
  dnf:
    name:
      - qemu-guest-agent
      - git
      - curl
      - vim
    state: present

- name: Start and enable qemu-guest-agent
  systemd:
    name: qemu-guest-agent
    state: started
    enabled: true

- name: Create ansible group
  group:
    name: ansible
    state: present

- name: Create ansible user
  user:
    name: ansible
    group: ansible
    groups: wheel
    shell: /bin/bash
    create_home: true
    state: present

- name: Deploy SSH key for ansible user
  authorized_key:
    user: ansible
    key: "{{ ansible_ssh_public_key }}"
    state: present

- name: Passwordless sudo for ansible user
  copy:
    dest: /etc/sudoers.d/ansible
    content: "ansible ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Deploy SSH hardening drop-in
  template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-vm-base.conf
    mode: "0600"
    owner: root
    group: root
  notify: restart sshd
