---
- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    owner: ansible
    group: docker
    mode: "0775"
  loop:
    - "{{ netboot_dir }}"
    - "{{ netboot_config_dir }}"
    - "{{ netboot_assets_dir }}"
    - "{{ netboot_assets_dir }}/almalinux9"

- name: Cache AlmaLinux 9 kernel + initrd locally
  get_url:
    url: "{{ item.url }}"
    dest: "{{ netboot_assets_dir }}/almalinux9/{{ item.filename }}"
    owner: ansible
    group: docker
    mode: "0644"
    timeout: 120
  loop:
    - url: "http://repo.almalinux.org/almalinux/9/BaseOS/x86_64/os/images/pxeboot/vmlinuz"
      filename: vmlinuz
    - url: "http://repo.almalinux.org/almalinux/9/BaseOS/x86_64/os/images/pxeboot/initrd.img"
      filename: initrd.img

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ netboot_dir }}/docker-compose.yml"
    owner: ansible
    group: docker
    mode: "0644"

- name: Deploy custom.ipxe (homelab boot menu)
  template:
    src: custom.ipxe.j2
    dest: "{{ netboot_config_dir }}/menus/custom.ipxe"
    owner: ansible
    group: docker
    mode: "0644"

- name: Deploy local-vars.ipxe (keyboard layout etc.)
  template:
    src: local-vars.ipxe.j2
    dest: "{{ netboot_config_dir }}/menus/local-vars.ipxe"
    owner: ansible
    group: docker
    mode: "0644"

- name: Deploy kickstart and answer files
  template:
    src: "{{ item }}"
    dest: "{{ netboot_assets_dir }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: ansible
    group: docker
    mode: "0644"
  loop:
    - almalinux-answers.ks.j2
    - pve-answers.toml.j2

- name: Start netboot.xyz
  community.docker.docker_compose_v2:
    project_src: "{{ netboot_dir }}"
    state: present
    pull: always

- name: Restart container so :z SELinux labels are applied to all files
  community.docker.docker_compose_v2:
    project_src: "{{ netboot_dir }}"
    state: restarted
