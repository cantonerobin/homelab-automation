---
- name: Add Docker repository
  get_url:
    url: https://download.docker.com/linux/rhel/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"

- name: Install Docker
  dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: true

- name: Add user to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Create compose directory
  file:
    path: "{{ docker_compose_dir }}"
    state: directory
    owner: "{{ docker_compose_dir_owner | default('ansible') }}"
    group: docker
    mode: "0775"

- name: Install useful tools
  dnf:
    name:
      - git
      - vim
      - curl
      - jq
    state: present
