# ApplicationSet: automatically creates one ArgoCD Application per subdirectory.
# Workflow: add a folder under k3s/infrastructure/ or k3s/apps/, push → ArgoCD picks it up.
#
# Applied once by Ansible (pve_vm_k3s.yml → tasks/argocd.yml)

---
# Infrastructure components (cert-manager, traefik, sealed-secrets, longhorn, …)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: git@gitlab.com:homelab5023328/infrastructure.git
        revision: main
        directories:
          # Match every direct subdirectory of k3s/infrastructure/
          - path: k3s/infrastructure/*
          # Exclude argocd/ — contains only Ansible Helm values, not k8s manifests
          - path: k3s/infrastructure/argocd
            exclude: true
  template:
    metadata:
      # Application name = folder name (e.g. "traefik", "cert-manager")
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: git@gitlab.com:homelab5023328/infrastructure.git
        targetRevision: main
        # Path to the folder that triggered this Application
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        # Deploy into a namespace with the same name as the folder
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true      # remove resources deleted from git
          selfHeal: true   # revert manual cluster changes
        syncOptions:
          - CreateNamespace=true

---
# Workloads (Authentik, Homepage, Nextcloud, Arr-Stack, …)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: git@gitlab.com:homelab5023328/infrastructure.git
        revision: main
        directories:
          - path: k3s/apps/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: git@gitlab.com:homelab5023328/infrastructure.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
